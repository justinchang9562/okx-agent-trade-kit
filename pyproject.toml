[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "okx-agent-trade-kit"
version = "0.4.2"
description = "Deterministic minute-level OKX Demo spot scalping agent"
requires-python = ">=3.11"
dependencies = [
  "certifi>=2026.7.22,<2027",
  "fastapi>=0.116,<1",
  "PyYAML>=6.0.2,<7",
  "uvicorn>=0.35,<1",
  "websockets>=15,<17",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<10",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6,<8",
  "ruff>=0.12,<1",
]

[project.scripts]
okx-agent = "trading_agent.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["trading_agent", "data", "indicators", "strategies", "risk", "decision", "execution", "backtest", "storage", "monitoring"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: manually invoked OKX Demo backend tests; always excluded from CI"]

[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["frontend/dist", "data_cache"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
